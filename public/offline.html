<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101d3f" />
    <title>Sem conexão · PH Outlet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #f7f8fa; color: #171b22; font-family: system-ui, sans-serif; text-align: center; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #dfe3e8; border-radius: 24px;
        background: #fff; box-shadow: 0 18px 50px rgba(20, 25, 34, .09); }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 22px 0 8px; font-size: 24px; }
      p { margin: 0; color: #667085; line-height: 1.5; }
      button { margin-top: 24px; min-height: 44px; border: 0; border-radius: 12px; padding: 0 20px;
        background: #171b22; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="PH Outlet" />
      <h1>Sem conexão</h1>
      <p>Conecte-se à internet para acessar dados e realizar operações com segurança. Nenhuma venda ou alteração é simulada offline.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
